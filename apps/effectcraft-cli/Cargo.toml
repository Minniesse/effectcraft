[package]
name = "effectcraft-cli"
description = "EffectCraft headless CLI: render frames and sequences, run commands, MCP server"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

# Every feature is on by default (the upstream build); the KatWork build turns them off with
# `--no-default-features`.
[features]
default = ["model-download", "plugins", "scripting", "self-update"]
model-download = ["effectcraft-host/model-download"]
plugins = ["effectcraft-host/plugins"]
scripting = ["effectcraft-host/scripting", "effectcraft-ui-egui/scripting"]
self-update = ["effectcraft-ui-egui/self-update"]

[[bin]]
name = "effectcraft-cli"
path = "src/main.rs"

[dependencies]
effectcraft-engine = { workspace = true }
effectcraft-host = { workspace = true }
effectcraft-automation = { workspace = true }
effectcraft-ui-egui = { workspace = true }
effectcraft-render = { workspace = true }
effectcraft-gpu = { workspace = true }
effectcraft-time = { workspace = true }
effectcraft-track = { workspace = true }
effectcraft-segment = { workspace = true }
effectcraft-sam2 = { workspace = true }
serde_json = { workspace = true }
image = { workspace = true }
cpu-time = "1"
