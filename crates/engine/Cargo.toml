[package]
name = "effectcraft-engine"
description = "The EffectCraft engine: session, undo history, editor state and the command registry every frontend (UI, CLI, control channel, MCP) dispatches through"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = ["model-download", "plugins", "scripting"]
# `roto.model.download` and `face.model.download`: fetch model weights with the system curl.
# Without it those commands are unknown; Install from File still works.
model-download = []
# The Plug-in Library's https downloads from GitHub (catalog, packages; the system curl). Without
# it they answer "not available in this build"; the WebAssembly runtime itself is in
# `effectcraft-plugin`, which `effectcraft-host` links only with its own `plugins` feature.
plugins = []
# The script commands (`script.run`, File ▸ Scripts, ScriptUI panels) and their menu items. The
# runner itself is `effectcraft-script`, which `effectcraft-host` links with its `scripting`.
scripting = []

[dependencies]
craft-docpath = { workspace = true }
effectcraft-time = { workspace = true }
effectcraft-geom = { workspace = true }
effectcraft-color = { workspace = true }
effectcraft-keyframe = { workspace = true }
effectcraft-project = { workspace = true }
effectcraft-raster = { workspace = true }
effectcraft-path = { workspace = true }
effectcraft-text = { workspace = true }
effectcraft-effects = { workspace = true }
effectcraft-render = { workspace = true }
effectcraft-segment = { workspace = true }
effectcraft-track = { workspace = true }
effectcraft-model = { workspace = true }
effectcraft-lottie = { workspace = true }
effectcraft-interchange = { workspace = true }
effectcraft-psd = { workspace = true }
effectcraft-aep = { workspace = true }
kurbo = { workspace = true }
effectcraft-svg = { workspace = true }
effectcraft-pdf = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
chrono = { workspace = true }
rayon = { workspace = true }
image = { workspace = true }
web-time = { workspace = true }
exr = { workspace = true }

# Native file identity and SAM 2 inference; browsers keep the built-in engines.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
memory-stats = { workspace = true }
same-file = { workspace = true }
tempfile = { workspace = true }
effectcraft-sam2 = { workspace = true }
